<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 150" width="720" height="150" role="img" aria-label="The five pillars of ikigai: starting small, releasing yourself, harmony and sustainability, the joy of little things, being here now.">
  <!-- Every colour and font is set as a presentation attribute rather than in a
       <style> block, because GitHub sanitises SVG on some paths and a stripped
       stylesheet would leave black text and unfilled bars.

       Colours read on both the light (#ffffff) and dark (#0d1117) GitHub
       canvases, since one SVG cannot switch with the theme. #797979 is the
       mathematically optimal dual-theme grey at 4.35:1 either way; #4D77CF
       sits at 4.33 / 4.38. The background is deliberately transparent. -->

  <g text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif">

    <rect x="58" y="18" width="28" height="64" rx="6" fill="#4D77CF"/>
    <text x="72" y="55" font-size="13" font-weight="600" fill="#ffffff">1</text>
    <text x="72" y="104" font-size="12.5" fill="#797979">Starting</text>
    <text x="72" y="119" font-size="12.5" fill="#797979">small</text>

    <rect x="202" y="18" width="28" height="64" rx="6" fill="#4D77CF"/>
    <text x="216" y="55" font-size="13" font-weight="600" fill="#ffffff">2</text>
    <text x="216" y="104" font-size="12.5" fill="#797979">Releasing</text>
    <text x="216" y="119" font-size="12.5" fill="#797979">yourself</text>

    <rect x="346" y="18" width="28" height="64" rx="6" fill="#4D77CF"/>
    <text x="360" y="55" font-size="13" font-weight="600" fill="#ffffff">3</text>
    <text x="360" y="104" font-size="12.5" fill="#797979">Harmony and</text>
    <text x="360" y="119" font-size="12.5" fill="#797979">sustainability</text>

    <rect x="490" y="18" width="28" height="64" rx="6" fill="#4D77CF"/>
    <text x="504" y="55" font-size="13" font-weight="600" fill="#ffffff">4</text>
    <text x="504" y="104" font-size="12.5" fill="#797979">The joy of</text>
    <text x="504" y="119" font-size="12.5" fill="#797979">little things</text>

    <rect x="634" y="18" width="28" height="64" rx="6" fill="#4D77CF"/>
    <text x="648" y="55" font-size="13" font-weight="600" fill="#ffffff">5</text>
    <text x="648" y="104" font-size="12.5" fill="#797979">Being here</text>
    <text x="648" y="119" font-size="12.5" fill="#797979">now</text>

  </g>
</svg>
